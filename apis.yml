name: Okera
description: 'Okera was a data access governance and data security platform providing fine-grained,
  attribute-based access control, data discovery and classification, dynamic masking, and audit for
  analytics and machine-learning workloads across data lakes and warehouses. Founded around 2016, Okera
  was acquired by Databricks in May 2023 and folded into the Databricks governance stack (Unity Catalog).
  Okera no longer operates as an independent product: the okera.com domain now 301-redirects to
  databricks.com, and there is no standalone Okera developer portal, documentation, or public API
  surface remaining. This profile is retained in the API Evangelist network as an acquired-company record.'
